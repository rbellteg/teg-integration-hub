/* Codes (SMS and authenticator) expire after two minutes. "000000" is rejected so the wrong-code path can be shown. */
const CODE_TTL = 120;
const mmss = (n) => `${Math.floor(n / 60)}:${String(n % 60).padStart(2, "0")}`;

function MfaModal({ method, onCancel, onVerified, onFailed, busy, error }) {
  const [code, setCode] = useState("");
  const [bad, setBad] = useState(false);
  const [left, setLeft] = useState(CODE_TTL);
  useEffect(() => {
    const id = setInterval(() => setLeft((n) => (n > 0 ? n - 1 : 0)), 1000);
    return () => clearInterval(id);
  }, []);
  const sms = method === "sms";
  const expired = left === 0;
  const valid = /^\d{6}$/.test(code);
  function submit() {
    // an expired code is rejected with the same message as an incorrect one
    if (code === "000000" || expired) { setBad(true); onFailed(); return; }
    setBad(false);
    onVerified();
  }
  function resend() { setLeft(CODE_TTL); setCode(""); setBad(false); }
  return (
    <Modal title="Authentication required" onClose={onCancel} busy={busy} error={error} width={480}
      icon={<IconCircle tone="info"><ShieldCheck size={17} color="#2563EB" /></IconCircle>}
      footer={<><Btn onClick={onCancel}>Cancel</Btn><Primary disabled={!valid} onClick={submit}>Authenticate</Primary></>}>
      <p style={bodyText}>This action requires further authentication. Enter the 6-digit verification code from {sms ? "your SMS" : "your authenticator app"}.</p>
      <div style={{ marginTop: 14, background: "#F5F5F5", borderRadius: 10, padding: 16 }}>
        <label style={{ ...labelStyle, color: bad ? "#C0525A" : "#1F2937", fontWeight: bad ? 500 : 600, marginBottom: 8 }}>
          {bad ? BAD_CODE_COPY : "Enter verification code"}
        </label>
        <input autoFocus inputMode="numeric" maxLength={6} value={code}
          onChange={(e) => { setCode(e.target.value.replace(/\D/g, "")); setBad(false); }}
          placeholder={"\u2022\u2022\u2022\u2022\u2022\u2022"}
          style={{ ...inputStyle, fontSize: 16, letterSpacing: 6, borderRadius: 8, border: `1px solid ${bad ? "#C0525A" : "#D1D5DB"}` }} />
        {expired ? (
          <div style={{ marginTop: 10 }}>
            <p style={{ margin: "0 0 8px", fontSize: 12.5, color: "#1F2937" }}>The verification code has expired.</p>
            {sms && <Btn onClick={resend} style={{ background: "#5B8BD6", color: "#fff", border: "none", borderRadius: 999, padding: "7px 14px" }}>Resend verification code</Btn>}
          </div>
        ) : (
          <p style={{ margin: "10px 0 0", fontSize: 12.5, color: "#1F2937" }}>
            {sms ? "The verification code has been sent. " : ""}It will expire after {mmss(left)}.
          </p>
        )}
      </div>
      <p style={{ margin: "14px 0 0", fontSize: 12.5, color: "#6B7280", lineHeight: 1.6 }}>
        Learn more about 2FA on the TEG platform{" "}
        <a href={TWOFA_HELP_URL} target="_blank" rel="noopener noreferrer" style={{ color: "#2563EB" }}>here</a>.
        <br />
        Lost your phone or changed your number? Please{" "}
        <a href={SUPPORT_URL} target="_blank" rel="noopener noreferrer" style={{ color: "#2563EB" }}>submit a ticket</a>.
      </p>
      <p style={{ margin: "8px 0 0", fontSize: 11.5, color: "#9CA3AF" }}>(Prototype: any 6 digits work, except 000000, which is rejected. An expired code is also rejected.)</p>
    </Modal>
  );
}

      <Select value={sel} onChange={(v) => { if (v === NOT_LISTED) { onNotListed(); return; } setSel(v); setOk(false); }}
        placeholder={"Choose a provider\u2026"} options={options.filter((o) => o !== current)}
        extra={{ value: NOT_LISTED, label: "My new TMS provider isn\u2019t listed" }} disabledExtra={requestBlocked} />
      {sel && (
        <>
          <div style={{ marginTop: 14, background: "#FFFBEB", border: "1px solid #FDE68A", borderRadius: 6, padding: "10px 12px", fontSize: 12.5, color: "#92400E", lineHeight: 1.5 }}>
            {current} keeps working until {sel} makes its first request with the new key. We{"\u2019"}ll email {sel} a secure link to your new API key, and let {current} know once their key has been replaced.
          </div>
          <CheckRow checked={ok} onChange={setOk}>I already use {sel}{"\u2019"}s TMS and have given them my member ID ({MEMBER_ID}).</CheckRow>
        </>
      )}
    </Modal>
  );
}

        <input value={contactName} onChange={(e) => setContactName(e.target.value)} placeholder="Full name" style={{ ...inputStyle, marginBottom: 14 }} />

        <label style={labelStyle}>What kind of TMS is this? *</label>
        <div style={{ marginTop: 8, marginBottom: 14, display: "flex", flexDirection: "column", gap: 7 }}>
          {[

            <label key={o.id} style={{ display: "flex", alignItems: "center", gap: 9, fontSize: 13, color: "#374151", cursor: "pointer" }}>

}

/* ---------- app ---------- */

function App() {
  const [tab, setTab] = useState("tms");
  const [detected, setDetected] = useState("none"); // none | xapi | basic
  const [eligible, setEligible] = useState(true);
  const [bespokeOk, setBespokeOk] = useState(false);
  const [extraProviders, setExtraProviders] = useState([]);
  const [panelOpen, setPanelOpen] = useState(true);
  const [mfaMethod, setMfaMethod] = useState("app");
  const [upgradeSent, setUpgradeSent] = useState(false);
  const [hub, setHub] = useState(newHub());
  const [modal, setModal] = useState(null);
  const [selected, setSelected] = useState("");
  const [log, setLog] = useState([]);
  const [toast, setToast] = useState("");
  // A3
  const [failNext, setFailNext] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const failRef = useRef(false);
  const busyRef = useRef(false);
  failRef.current = failNext;

  // A not-eligible member has no working API access (downgrade removes it), so they only ever see "Integrate your TMS"
  const view = hub.provider ? "integrated" : detected === "none" || !eligible ? "new" : "unconfirmed";
  const providers = [...PARTNERS, ...(bespokeOk ? [BESPOKE] : []), ...extraProviders].sort((a, b) => a.localeCompare(b));

  useEffect(() => {
    function onKey(e) { if (e.key === "Escape" && !busyRef.current) { setModal(null); setErr(""); } }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const openModal = (m) => { setErr(""); setBusy(false); busyRef.current = false; setModal(m); };

  function addLog(kind, text) {
    setLog((l) => [{ id: `${Date.now()}-${Math.random()}`, kind, text }, ...l].slice(0, 40));
  }
  function flash(msg) { setToast(msg); setTimeout(() => setToast(""), 3200); }
  function resetAll(d = detected) {
    setHub(newHub()); openModal(null); setSelected(""); setLog([]); setExtraProviders([]); setUpgradeSent(false); setDetected(d);
  }

  /* A3: every action runs through here. Double submission is blocked; on failure the pop-up stays open,
     shows the PRD error copy, and nothing is saved, sent or revoked. */
  function run(fn) {
    if (busyRef.current) return;
    busyRef.current = true; setBusy(true); setErr("");
    setTimeout(() => {
      busyRef.current = false; setBusy(false);
      if (failRef.current) {
        setFailNext(false); failRef.current = false;
        setErr(ERROR_COPY);
        addLog("record", "Action failed: nothing saved, sent or revoked");
        return;
      }
      fn();
    }, 600);
  }

  function eligibleOrUpgrade(p) {
    if (eligible) return true;
    // IN-03 and EM-05 are sent once per member until upgraded; later attempts only repeat the confirmation
    openModal(upgradeSent ? { type: "upgrade-sent", repeat: true } : { type: "upgrade", provider: p });
    return false;
  }
  function askMfa(label, next) { openModal({ type: "mfa", actionLabel: label, next }); }

  /* ----- actions (A1: every email the PRD lists is logged with its EM/IN code) ----- */

  function doGetStarted(p) {
    addLog("email-ext", `EM-20 \u2192 ${p} integration contact: secure link to API key + member ID ${MEMBER_ID}`);
    addLog("email-member", "EM-21 \u2192 member: secure link sent to your provider");
    addLog("email-int", "IN-01 \u2192 Exchange BAs: Hub notification (key issued)");
    addLog("record", `Audit: ${p} selected, API key created, status Pending`);
    setHub((h) => ({ ...h, provider: p, status: "pending", pendingKind: "first", everActive: false, lastActive: "" }));
    openModal(null); setSelected("");
  }
  function doConfirmProvider(p) {
    addLog("record", `Audit: ${p} confirmed as TMS provider (no key, no email, connection unchanged)`);
    setHub((h) => ({ ...h, provider: p, status: "active", pendingKind: null, everActive: true, lastActive: DEMO_LAST_ACTIVE }));
    openModal(null); setSelected("");
  }
  function doRegenerate() {
    addLog("email-ext", `EM-20 \u2192 ${hub.provider} integration contact: secure link to new API key + member ID ${MEMBER_ID}`);
    addLog("email-member", "EM-21 \u2192 member: new key link sent to your provider");
    addLog("email-int", "IN-01 \u2192 Exchange BAs: Hub notification (key regenerated)");
    addLog("record", "Audit: key regenerated. Current key stays valid until first request with the new key");
    setHub((h) => ({ ...h, status: "pending", pendingKind: "reset" }));
  }
  function doSwitch(p) {
    addLog("email-ext", `EM-20 \u2192 ${p} integration contact: secure link to new API key + member ID ${MEMBER_ID}`);
    addLog("email-member", `EM-26 \u2192 member: key link sent to ${p}`);
    addLog("email-int", "IN-01 \u2192 Exchange BAs: Hub notification (provider switched)");
    addLog("record", `Audit: switch ${hub.provider} \u2192 ${p}. Old key stays valid until first request with the new key`);
    setHub((h) => ({ ...h, previousProvider: h.provider, provider: p, status: "pending", pendingKind: "switch", availableToSwitch: "" }));
  }
  function doDisconnect() {
    if (hub.provider) addLog("email-ext", `EM-25 \u2192 ${hub.provider} integration contact: key revoked, stop sending requests (API returns 401)`);
    addLog("email-member", "EM-24 \u2192 member: your TMS has been disconnected");
    addLog("email-int", "IN-01 \u2192 Exchange BAs: Hub notification (disconnected)");
    addLog("record", "Audit: API key revoked, provider cleared");
    const open = hub.openRequest;
    setHub({ ...newHub(), openRequest: open ? { ...open, variant: "new" } : null });
    setDetected("none");
  }
  function doRequest(variant, d) {
    const summary = `${d.name} (${d.kind}${d.contactName ? `, contact ${d.contactName}` : ""}, ${d.email})`;
    if (variant === "integrated" && d.kind === "bespoke") {
      addLog("record", `Captured: bespoke provider ${summary}, visible to this member only (no email)`);
      doConfirmProvider(d.name);
      return;
    }
    const prev = hub.openRequest;
    if (prev) {
      addLog("email-int", `IN-01 \u2192 Exchange BAs: earlier request for ${prev.name} cancelled and replaced by ${d.name}`);
      addLog("email-ext", `MANUAL EM-32 (BA) \u2192 ${prev.name} contact: request cancelled, no further action needed`);
    }
    addLog("email-member", `EM-06 \u2192 member: we\u2019ve received your request for ${d.name}`);
    addLog("email-ext", `EM-09 \u2192 ${d.email}: integration request + security questionnaire`);
    addLog("email-int", `IN-01 \u2192 Exchange BAs: ${variant === "new" ? "new integration request" : variant === "switch" ? "switch to unlisted provider" : "unlisted provider (already integrated)"}, ${summary}`);
    // The member stays on the same screen with the dropdown, so they can use it once the provider is added
    // (and can still connect to any approved provider meanwhile). One open request per member.
    setHub((h) => ({ ...h, openRequest: { name: d.name, at: fmt(new Date()), kind: d.kind, variant } }));
    // New and already-integrated requests show a banner on that screen. Switch requests have no banner
    // (current integration unaffected), so they keep the confirmation pop-up.
    if (variant === "switch") setModal({ type: "submitted", variant, name: d.name });
    else openModal(null);
  }
  function doCancelRequest() {
    const name = hub.openRequest ? hub.openRequest.name : "";
    addLog("email-int", `IN-01 \u2192 Exchange BAs: member cancelled request for ${name}`);
    addLog("email-ext", `MANUAL EM-32 (BA) \u2192 ${name} contact: request cancelled, no further action needed`);
    setHub((h) => ({ ...h, openRequest: null })); openModal(null);
  }
  function doUpgrade(p) {
    addLog("email-int", `IN-03 \u2192 Key Accounts Team Group: upgrade request (member ${MEMBER_ID}${p ? `, interested in ${p}` : ""})`);
    addLog("email-member", "EM-05 \u2192 member: we\u2019ve let your account manager know");
    addLog("record", "Audit: upgrade requested (once per member until upgraded)");
    setUpgradeSent(true); openModal({ type: "upgrade-sent", repeat: false });
  }

  /* simulated back-office / TMS events */
  function simApprove() {
    const r = hub.openRequest;
    addLog("record", `BA set request for ${r.name} to Approved in the database`);
    addLog("email-member", r.variant === "switch"
      ? `EM-16 \u2192 member: ${r.name} has been added. Select Switch provider and choose it from the list`
      : `EM-16 \u2192 member: ${r.name} has been added, so you can now connect to it`);
    if (r.kind === "bespoke") addLog("record", "No EM-17 for a bespoke provider (EM-22 already reaches the member)");
    else addLog("email-ext", `EM-17 \u2192 ${r.name} integration contact: approved as a TMS provider`);
    setExtraProviders((d) => (d.includes(r.name) ? d : [...d, r.name]));
    setHub((h) => ({ ...h, openRequest: null, availableToSwitch: r.variant === "switch" ? r.name : "" }));
    if (r.variant !== "switch") setSelected(r.name);
  }
  function simDecline() {
    const r = hub.openRequest;
    addLog("record", `BA set request for ${r.name} to Declined in the database`);
    addLog("email-member", `MANUAL EM-19 \u2192 member: request for ${r.name} wasn\u2019t approved. The BA writes the reason`);
    addLog("record", "Provider emailed manually (EM-18) only if they have engaged with the request");
    setHub((h) => ({ ...h, openRequest: null }));
  }
  function simTmsRequest() {
    const now = fmt(new Date());
    if (!hub.provider) return;
    if (hub.status === "pending") {
      if (hub.pendingKind === "switch" && hub.previousProvider) {
        addLog("email-ext", `EM-27 \u2192 ${hub.previousProvider} integration contact: your key for member ${MEMBER_ID} has been replaced`);
        addLog("record", "Old key invalidated on first request with the new key");
      } else if (hub.pendingKind === "reset") addLog("record", "Old key replaced on first request with the new key");
      else addLog("record", "First request received from TMS");
      setHub((h) => ({ ...h, status: "active", pendingKind: null, everActive: true, lastActive: now, previousProvider: "" }));
    } else {
      addLog("record", "Request received from TMS: last active updated");
      setHub((h) => ({ ...h, lastActive: now }));
    }
  }

  function changeEligibility(on) {
    setEligible(on); setUpgradeSent(false);
    if (!on && (hub.provider || detected !== "none" || hub.openRequest)) {
      addLog("record", "Downgrade: API access removed immediately (X-API key and basic auth), audit-logged. Member sees the not-eligible experience");
      setHub(newHub()); setSelected(""); setDetected("none"); openModal(null);
    }
  }
  function startOrConfirm() {
    if (selected && eligibleOrUpgrade(selected))
      openModal(view === "new" ? { type: "integrate", provider: selected } : { type: "confirm-provider", provider: selected });
  }
  function onSelect(v) {
    if (v === OTHER || v === NOT_LISTED) {
      setSelected("");
      if (!eligibleOrUpgrade("")) return;
      openModal({ type: "request", variant: view === "new" ? "new" : "integrated" });
      return;
    }
    setSelected(v);
  }

  const hasOpenRequest = !!hub.openRequest;
  // A switch is in progress until the new provider's first request arrives; Regenerate and Disconnect stay available
  const switching = hub.status === "pending" && hub.pendingKind === "switch";
  const r = hub.openRequest;
  const reqBanner = r ? (
    <Banner title={`Request submitted for ${r.name}`}
      action={<LinkBtn onClick={() => openModal({ type: "cancel-request" })}>Cancel request</LinkBtn>}>
      {r.variant === "switch"
        ? <>We{"\u2019"}ve received your request to add {r.name}. Your current integration with {hub.provider} isn{"\u2019"}t affected. We{"\u2019"}ll email you once it{"\u2019"}s been added. Then select Switch provider and choose {r.name} from the list.</>
        : <>We{"\u2019"}ve received your request to add {r.name}. We{"\u2019"}ll email you once we{"\u2019"}ve reviewed it. If it{"\u2019"}s approved, you can then connect to {r.name}.</>}
    </Banner>
  ) : null;
  const availableBanner = hub.availableToSwitch ? (
    <Banner title={`${hub.availableToSwitch} is now available`}>
      Select Switch provider and choose {hub.availableToSwitch} to move your integration to it. {hub.provider} keeps working until you switch.
    </Banner>
  ) : null;
  const sharedUi = { busy, error: err };

  return (
    <div style={{ fontFamily: "'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif", background: "#fff", minHeight: "100vh", display: "flex" }}>
      {/* Left icon sidebar */}
      <div style={{ width: 56, background: "#0B1220", display: "flex", flexDirection: "column", alignItems: "center", padding: "14px 0", flexShrink: 0 }}>
        <div style={{ width: 30, height: 30, borderRadius: 6, background: "#fff", color: "#0B1220", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, fontSize: 12, marginBottom: 26 }}>HX</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 22 }}>
          <FilePen size={17} color="#9CA8BD" /><BarChart3 size={17} color="#9CA8BD" /><Receipt size={17} color="#9CA8BD" /><LayoutGrid size={17} color="#9CA8BD" />
        </div>
        <div style={{ marginTop: "auto", display: "flex", flexDirection: "column", gap: 20 }}>
          <LayoutGrid size={17} color="#9CA8BD" /><Bell size={17} color="#9CA8BD" />
        </div>
      </div>

      <div style={{ flex: 1 }}>
        {/* Top nav */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 24px", height: 48, borderBottom: "1px solid #F1F2F4" }}>
          <div style={{ display: "flex", gap: 30 }}>
            {["Freight Exchange", "SmartPay", "Integrations", "Notifications"].map((m) => (
              <div key={m} style={{ fontSize: 13.5, height: 48, display: "flex", alignItems: "center", color: m === "Integrations" ? "#1F2937" : "#6B7280", fontWeight: m === "Integrations" ? 700 : 500, borderBottom: m === "Integrations" ? "2px solid #1F2937" : "2px solid transparent" }}>{m}</div>
            ))}
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
            <Settings size={17} color="#6B7280" />
            <div style={{ width: 26, height: 26, borderRadius: 999, background: "#E5E7EB" }} />
          </div>
        </div>

        <div style={{ maxWidth: 900, margin: "0 auto", padding: "26px 32px 60px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 22 }}>
            <Settings size={20} color="#374151" />
            <h1 style={{ fontSize: 21, fontWeight: 700, color: "#1F2937", margin: 0 }}>Settings</h1>
          </div>

          <div style={{ display: "flex", gap: 0, border: "1px solid #E5E7EB", borderRadius: 8, marginBottom: 24, width: "fit-content" }}>
            {["Accounts Payable", "Accounts Receivable", "TMS"].map((t, i) => {
              const id = t === "TMS" ? "tms" : t.toLowerCase().replace(" ", "-");
              const active = tab === id;
              return (
                <button key={t} onClick={() => setTab(id)}
                  style={{ background: "none", border: "none", borderRight: i < 2 ? "1px solid #E5E7EB" : "none", padding: "11px 22px", fontSize: 13.5, fontWeight: 600, color: active ? "#1F2937" : "#9CA3AF", borderBottom: active ? "2px solid #1F2937" : "2px solid transparent", cursor: "pointer" }}>
                  {t}
                  {t === "TMS" && <span style={{ marginLeft: 8, fontSize: 9.5, fontWeight: 700, color: "#2563EB", background: "#EFF6FF", padding: "2px 6px", borderRadius: 999, verticalAlign: 2 }}>NEW</span>}
                </button>
              );
            })}
          </div>

          {tab !== "tms" ? (
            <div style={{ color: "#9CA3AF", fontSize: 13.5, padding: "60px 0", textAlign: "center" }}>
              {tab === "accounts-payable" ? "Accounts Payable" : "Accounts Receivable"} settings, unchanged, not part of this prototype.
            </div>
          ) : (
            <div style={{ maxWidth: 620 }}>
              {view === "new" && (
                <>
                  <h2 style={{ fontSize: 20, fontWeight: 700, color: "#1F2937", margin: "0 0 4px" }}>Integrate your TMS</h2>
                  <p style={{ fontSize: 13.5, color: "#6B7280", margin: "0 0 16px" }}>{SUBTITLE}</p>
                  {reqBanner}
                  <label style={{ ...labelStyle, fontSize: 13, marginBottom: 8 }}>Select your TMS provider</label>
                  <Select value={selected} onChange={onSelect} placeholder={"Choose a provider\u2026"} options={providers}
                    extra={{ value: OTHER, label: "Other TMS provider\u2026" }} disabledExtra={false} style={{ maxWidth: 380, marginBottom: 14 }} />
                  <Primary disabled={!selected} onClick={startOrConfirm}>Get started</Primary>
                  <div style={{ borderTop: "1px solid #F1F2F4", paddingTop: 24, marginTop: 34 }}>
                    <h2 style={{ fontSize: 20, fontWeight: 700, color: "#1F2937", margin: "0 0 6px" }}>Why integrate?</h2>
                    <p style={{ fontSize: 13.5, color: "#6B7280", margin: "0 0 22px", lineHeight: 1.5 }}>Integrate your TMS with TEG to post loads, receive updates, and manage documents seamlessly.</p>
                    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
                      {BENEFITS.map((b) => {
                        const Icon = b.icon;
                        return (
                          <div key={b.lead} style={{ display: "flex", gap: 12, alignItems: "flex-start" }}>
                            <div style={{ width: 30, height: 30, borderRadius: 6, background: "#F3F4F6", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, marginTop: 1 }}>
                              <Icon size={15} color="#374151" />
                            </div>
                            <p style={{ margin: 0, fontSize: 13.5, color: "#374151", lineHeight: 1.55 }}><strong>{b.lead}</strong> {b.body}</p>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </>
              )}

              {view === "unconfirmed" && (
                <>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 4 }}>
                    <h2 style={{ fontSize: 20, fontWeight: 700, color: "#1F2937", margin: 0 }}>Confirm your TMS provider</h2>
                    {detected === "xapi" && <LinkBtn onClick={() => openModal({ type: "disconnect" })}>Disconnect</LinkBtn>}
                  </div>
                  <p style={{ fontSize: 13.5, color: "#6B7280", margin: "0 0 16px" }}>{SUBTITLE}</p>
                  {reqBanner}
                  <label style={{ ...labelStyle, fontSize: 13, marginBottom: 8 }}>Select your TMS provider</label>
                  <Select value={selected} onChange={onSelect} placeholder={"Choose a provider\u2026"} options={providers}
                    extra={{ value: NOT_LISTED, label: "My TMS provider isn\u2019t listed" }} disabledExtra={false} style={{ maxWidth: 380, marginBottom: 14 }} />
                  <Primary disabled={!selected} onClick={startOrConfirm}>Confirm</Primary>
                </>
              )}

              {view === "integrated" && (
                <>
                  <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 4 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                      <span style={{ fontSize: 20, fontWeight: 700, color: "#1F2937" }}>Integration with {hub.provider}</span>
                    </div>
                    <div style={{ display: "flex", gap: 14, flexShrink: 0, marginLeft: 16 }}>
                      <LinkBtn disabled={switching}
                        title={switching ? `You can switch again once ${hub.provider} makes its first request.` : undefined}
                        onClick={() => openModal({ type: "switch", preselect: hub.availableToSwitch })}>Switch provider</LinkBtn>
                      <LinkBtn onClick={() => openModal({ type: "disconnect" })}>Disconnect</LinkBtn>
                    </div>
                  </div>
                  <div style={{ margin: "2px 0 18px" }}><StatusLine hub={hub} /></div>
                  {hub.status === "pending" && <PendingBanner hub={hub} basicAuth={detected === "basic"} />}
                  {availableBanner}
                  {reqBanner}
                  <Btn icon={<RefreshCw size={13} />} onClick={() => openModal({ type: "reset" })}>Regenerate API key</Btn>
                </>
              )}

              <HelpResources />
            </div>
          )}
        </div>
      </div>

      {/* pop-ups */}
      {modal?.type === "integrate" && (
        <IntegrateModal provider={modal.provider} {...sharedUi} onCancel={() => openModal(null)} onConfirm={() => run(() => doGetStarted(modal.provider))} />
      )}
      {modal?.type === "confirm-provider" && (
        <ConfirmProviderModal provider={modal.provider} {...sharedUi} onCancel={() => openModal(null)} onConfirm={() => run(() => doConfirmProvider(modal.provider))} />
      )}
      {modal?.type === "reset" && (
        <RegenerateModal provider={hub.provider} onCancel={() => openModal(null)} onConfirm={() => askMfa("Regenerating your API key", doRegenerate)} />
      )}
      {modal?.type === "disconnect" && (
        <DisconnectModal provider={hub.provider} onCancel={() => openModal(null)} onConfirm={() => askMfa("Disconnecting", doDisconnect)} />
      )}
      {modal?.type === "switch" && (
        <SwitchModal current={hub.provider} options={providers} preselect={modal.preselect} requestBlocked={false} {...sharedUi}
          onCancel={() => openModal(null)} onNotListed={() => openModal({ type: "request", variant: "switch" })}
          onSend={(p) => askMfa("Switching provider", () => doSwitch(p))} />
      )}
      {modal?.type === "mfa" && (
        <MfaModal method={mfaMethod} {...sharedUi} onCancel={() => openModal(null)} onFailed={() => addLog("record", "2FA failed (nothing changed)")}
          onVerified={() => run(() => { addLog("record", "2FA passed"); const next = modal.next; openModal(null); next(); })} />
      )}
      {modal?.type === "request" && (
        <RequestModal variant={modal.variant} existing={hub.openRequest ? hub.openRequest.name : ""} listed={modal.variant === "switch" ? providers.filter((p) => p !== hub.provider) : providers} {...sharedUi}
          onClose={() => openModal(null)}
          onPickListed={(p) => {
            if (modal.variant === "switch") openModal({ type: "switch", preselect: p });
            else if (modal.variant === "new") { if (eligibleOrUpgrade(p)) openModal({ type: "integrate", provider: p }); }
            else if (eligibleOrUpgrade(p)) openModal({ type: "confirm-provider", provider: p });
          }}
          onSubmit={(d) => run(() => doRequest(modal.variant, d))} />
      )}
      {modal?.type === "cancel-request" && (
        <CancelRequestModal provider={hub.openRequest ? hub.openRequest.name : ""} {...sharedUi} onCancel={() => openModal(null)} onConfirm={() => run(doCancelRequest)} />
      )}
      {modal?.type === "submitted" && <SubmittedModal variant={modal.variant} name={modal.name} onClose={() => openModal(null)} />}
      {modal?.type === "upgrade-sent" && <UpgradeSentModal repeat={modal.repeat} onClose={() => openModal(null)} />}
      {modal?.type === "upgrade" && (
        <UpgradeModal provider={modal.provider} {...sharedUi} onClose={() => openModal(null)} onSend={() => run(() => doUpgrade(modal.provider))} />
      )}

      {toast && (
        <div style={{ position: "fixed", left: "50%", bottom: 28, transform: "translateX(-50%)", background: "#111827", color: "#fff", fontSize: 13, padding: "10px 16px", borderRadius: 8, display: "flex", alignItems: "center", gap: 8, zIndex: 80, boxShadow: "0 8px 20px rgba(16,24,40,0.3)" }}>
          <Check size={14} /> {toast}
        </div>
      )}

      {/* Prototype controls */}
      <div style={{ position: "fixed", right: 16, bottom: 16, width: panelOpen ? 330 : "auto", maxHeight: "82vh", overflowY: "auto", background: "#fff", border: "1px solid #D1D5DB", borderRadius: 10, boxShadow: "0 10px 30px rgba(16,24,40,0.18)", zIndex: 50, fontSize: 12.5, color: "#374151" }}>
        <button onClick={() => setPanelOpen((v) => !v)}
          style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, background: "#F9FAFB", border: "none", borderBottom: panelOpen ? "1px solid #E5E7EB" : "none", padding: "9px 12px", cursor: "pointer", fontWeight: 700, fontSize: 12.5, color: "#1F2937" }}>
          Prototype controls
          <span style={{ fontWeight: 500, color: "#6B7280" }}>{panelOpen ? "Hide" : "Show"}</span>
        </button>
        {panelOpen && (
          <div style={{ padding: 12 }}>
            <div style={{ fontWeight: 700, marginBottom: 6 }}>Member</div>
            {[
              { id: "none", label: "No API usage detected (new integration)" },
              { id: "xapi", label: "X-API key detected (already integrated)" },
              { id: "basic", label: "Basic auth detected (already integrated)" },
            ].map((o) => (
              <label key={o.id} style={{ display: "flex", gap: 7, alignItems: "center", marginBottom: 4, cursor: "pointer" }}>
                <input type="radio" name="detected" checked={detected === o.id} onChange={() => resetAll(o.id)} style={{ accentColor: "#111827" }} />
                {o.label}
              </label>
            ))}
            <label style={{ display: "flex", gap: 7, alignItems: "center", margin: "8px 0 4px", cursor: "pointer" }}>
              <input type="checkbox" checked={eligible} onChange={(e) => changeEligibility(e.target.checked)} style={{ accentColor: "#111827" }} />
              Subscription includes TMS integration
            </label>
            <label style={{ display: "flex", gap: 7, alignItems: "center", marginBottom: 10, cursor: "pointer" }}>
              <input type="checkbox" checked={bespokeOk} onChange={(e) => setBespokeOk(e.target.checked)} style={{ accentColor: "#111827" }} />
              Bespoke provider approved for this member
            </label>
            <div style={{ fontWeight: 700, margin: "10px 0 6px" }}>Primary 2FA method</div>
            {[{ id: "app", label: "Authenticator app" }, { id: "sms", label: "SMS" }].map((o) => (
              <label key={o.id} style={{ display: "flex", gap: 7, alignItems: "center", marginBottom: 4, cursor: "pointer" }}>
                <input type="radio" name="mfaMethod" checked={mfaMethod === o.id} onChange={() => setMfaMethod(o.id)} style={{ accentColor: "#111827" }} />
                {o.label}
              </label>
            ))}
            <div style={{ fontWeight: 700, margin: "10px 0 6px" }}>Simulate</div>
            <label style={{ display: "flex", gap: 7, alignItems: "center", marginBottom: 8, cursor: "pointer" }}>
              <input type="checkbox" checked={failNext} onChange={(e) => setFailNext(e.target.checked)} style={{ accentColor: "#111827" }} />
              Next action fails (shows the error pop-up state)
            </label>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              <Btn onClick={simTmsRequest} disabled={!hub.provider}>TMS makes a request</Btn>
              {hasOpenRequest && <Btn onClick={simApprove}>BA approves request in DB</Btn>}
              {hasOpenRequest && <Btn onClick={simDecline}>BA declines request in DB</Btn>}
              <Btn onClick={() => resetAll(detected)}>Reset</Btn>
            </div>
            <div style={{ fontWeight: 700, margin: "12px 0 6px", display: "flex", alignItems: "center", gap: 6 }}>
              <Mail size={13} /> Emails and records fired
            </div>
            {log.length === 0 ? (
              <div style={{ color: "#9CA3AF" }}>Nothing yet. Every former {"\u201C"}Zendesk ticket{"\u201D"} shows up here as an email.</div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                {log.map((m) => (
                  <div key={m.id} style={{ display: "flex", gap: 7, lineHeight: 1.4 }}>
                    <span style={{ flexShrink: 0, fontSize: 10.5, fontWeight: 700, padding: "1px 6px", borderRadius: 999, height: "fit-content", marginTop: 1,
                      background: m.kind === "email-ext" ? "#EFF6FF" : m.kind === "email-member" ? "#FFFBEB" : m.kind === "email-int" ? "#F3F4F6" : "#F0FDF4",
                      color: m.kind === "email-ext" ? "#2563EB" : m.kind === "email-member" ? "#92400E" : m.kind === "email-int" ? "#4B5563" : "#166534" }}>
                      {m.kind === "email-ext" ? "To provider" : m.kind === "email-member" ? "To member" : m.kind === "email-int" ? "Internal" : "Record"}
                    </span>
                    <span>{m.text}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
